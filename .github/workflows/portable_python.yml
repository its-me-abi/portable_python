name: Portable Python linux

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: ubuntu:20.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # =========================
      # 🧱 BUILD DEPENDENCIES
      # =========================
      - name: Install dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y \
            build-essential \
            wget \
            curl \
            libffi-dev \
            zlib1g-dev \
            libbz2-dev \
            libreadline-dev \
            libsqlite3-dev \
            liblzma-dev \
            tk-dev \
            uuid-dev \
            ca-certificates \
            libssl-dev

      # =========================
      # 🐍 BUILD PYTHON
      # =========================
      - name: Build Python
        run: |
          wget https://www.python.org/ftp/python/3.11.9/Python-3.11.9.tgz
          tar -xzf Python-3.11.9.tgz
          cd Python-3.11.9
          ./configure \
            --prefix=$PWD/../python-portable \
            --enable-optimizations \
          make -j$(nproc)
          make install

      # =========================
      # 📦 ENABLE PIP
      # =========================
      - name: Install pip
        run: |
          ./python-portable/bin/python3 -m ensurepip
          ./python-portable/bin/python3 -m pip install --upgrade pip setuptools wheel

      # =========================
      # 🧹 CLEAN (REDUCE SIZE)
      # =========================
      - name: Strip unused files
        run: |
          find python-portable -type d -name "__pycache__" -exec rm -rf {} + || true
          find python-portable -type d -name "test" -exec rm -rf {} + || true

          rm -rf python-portable/lib/python*/idlelib || true
          rm -rf python-portable/lib/python*/tkinter || true


      # =========================
      # 📦 UPLOAD
      # =========================
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: portable-python-ubuntu20
          path: python-portable
