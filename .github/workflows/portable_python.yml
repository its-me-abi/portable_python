name: Portable Python (Ubuntu 20 Compatible)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: ubuntu:20.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # =========================
      # 🧱 BUILD DEPENDENCIES
      # =========================
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y \
            build-essential \
            wget \
            curl \
            libffi-dev \
            zlib1g-dev \
            libbz2-dev \
            libreadline-dev \
            libsqlite3-dev \
            liblzma-dev \
            tk-dev \
            uuid-dev \
            ca-certificates \
            libssl-dev

      # =========================
      # 🔐 BUILD OPENSSL 1.1 (CRITICAL FOR UBUNTU 20)
      # =========================
      - name: Build OpenSSL 1.1
        run: |
          wget https://www.openssl.org/source/old/1.1.1/openssl-1.1.1w.tar.gz
          tar -xzf openssl-1.1.1w.tar.gz
          cd openssl-1.1.1w

          ./config \
            --prefix=$PWD/../openssl-build \
            --openssldir=$PWD/../openssl-build \
            shared

          make -j$(nproc)
          make install

      # =========================
      # 🐍 BUILD PYTHON
      # =========================
      - name: Build Python
        run: |
          wget https://www.python.org/ftp/python/3.11.9/Python-3.11.9.tgz
          tar -xzf Python-3.11.9.tgz
          cd Python-3.11.9

          export OPENSSL_DIR=$PWD/../openssl-build

          ./configure \
            --prefix=$PWD/../python-portable \
            --enable-optimizations \
            --with-openssl=$OPENSSL_DIR \
            LDFLAGS="-Wl,-rpath=$OPENSSL_DIR/lib"

          make -j$(nproc)
          make install

      # =========================
      # 📦 ENABLE PIP
      # =========================
      - name: Install pip
        run: |
          ./python-portable/bin/python3 -m ensurepip
          ./python-portable/bin/python3 -m pip install --upgrade pip setuptools wheel

      # =========================
      # 🧹 CLEAN (REDUCE SIZE)
      # =========================
      - name: Strip unused files
        run: |
          find python-portable -type d -name "__pycache__" -exec rm -rf {} + || true
          find python-portable -type d -name "test" -exec rm -rf {} + || true

          rm -rf python-portable/lib/python*/idlelib || true
          rm -rf python-portable/lib/python*/tkinter || true

      # =========================
      # 📁 MAKE PORTABLE RUNTIME
      # =========================
      - name: Package runtime
        run: |
          mkdir -p python-portable/lib

          cp -r openssl-build/lib/* python-portable/lib/ || true

          cat > python-portable/run.sh << 'EOF'
          #!/usr/bin/env bash
          DIR="$(cd "$(dirname "$0")" && pwd)"

          export LD_LIBRARY_PATH="$DIR/lib:$LD_LIBRARY_PATH"

          exec "$DIR/bin/python3" "$@"
          EOF

          chmod +x python-portable/run.sh

      # =========================
      # 📦 UPLOAD
      # =========================
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: portable-python-ubuntu20
          path: python-portable
